name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'tech-pwa/**'

jobs:
  check:
    name: TypeScript + Lint + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tech-pwa

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tech-pwa/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=critical

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run vitest
        run: npx vitest run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_DASHBOARD_API_URL: https://placeholder.example.com
          AUTH_SECRET: ci-placeholder-32-char-secret-xx
          NEXTAUTH_URL: http://localhost:3000
          DATABASE_URL: postgresql://placeholder:placeholder@placeholder/placeholder
          SENTRY_SUPPRESS_TURBOPACK_WARNING: 1
