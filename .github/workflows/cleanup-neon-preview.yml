# DISABLED 2026-07-08: This workflow has never had anything to clean up. Vercel
# preview deployments currently share the single "dev" Neon branch with production
# (see DEPLOYMENT.md > MIGRATION SAFETY) — no per-PR branch named preview/<ref> is
# ever created, so this job has failed on every PR close since it was added, deleting
# nothing. Re-enable (revert this trigger) only once Phase 2's "preview builds isolated"
# gate (IMPLEMENTATION_PLAN.md) actually creates a real per-PR Neon branch to delete —
# and re-verify the branch naming convention against whatever that implementation uses,
# don't assume preview/<head_ref> is still correct.
name: Cleanup Neon Preview Branch

on:
  workflow_dispatch:

jobs:
  delete-neon-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Delete Neon preview branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: purple-dust-72858226
          branch: preview/${{ github.head_ref }}
          api_key: ${{ secrets.NEON_API_KEY }}
